<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>بهینه‌ساز برق — مأموریت بوشهر</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#f0b820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="یار برق" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="description" content="بازی سه‌بعدی آموزش مدیریت مصرف برق برای کودکان و نوجوانان بوشهر" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="بهینه‌ساز برق — مأموریت بوشهر" />
    <meta property="og:description" content="بازی تعاملی یار برق — بوشهر، شهر انرژی‌های پاک" />
    <meta property="og:image" content="icon-512.png" />
    <meta property="og:type" content="website" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet" />
    
    <style>
      /* PWA install banner */
      #pwa-install {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        background: linear-gradient(180deg, #1a3a7a, #0e2654);
        border-top: 3px solid #f0b820;
        padding: 12px 16px;
        display: none;
        align-items: center;
        gap: 12px;
        font-family: "Vazirmatn", sans-serif;
        direction: rtl;
        animation: slideUp 0.4s ease-out;
      }
      @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      #pwa-install .icon { font-size: 32px; }
      #pwa-install .text { flex: 1; color: white; }
      #pwa-install .text .title { font-weight: 900; font-size: 14px; color: #f0b820; }
      #pwa-install .text .desc { font-size: 12px; opacity: 0.8; margin-top: 2px; }
      #pwa-install button {
        padding: 8px 20px;
        border-radius: 12px;
        border: 2px solid #f0b820;
        background: #f0b820;
        color: #0e2654;
        font-weight: 900;
        font-size: 14px;
        cursor: pointer;
        font-family: "Vazirmatn", sans-serif;
      }
      #pwa-install .close {
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- PWA Install Banner -->
    <div id="pwa-install">
      <div class="icon">⚡</div>
      <div class="text">
        <div class="title">یار برق را نصب کن!</div>
        <div class="desc">روی صفحه اصلی گوشیت نصب کن و هر وقت خواستی بازی کن</div>
      </div>
      <button id="pwa-install-btn">نصب ⚡</button>
      <button class="close" id="pwa-install-close">✕</button>
    </div>
    
    <script>
      // Register Service Worker (relative path so it works on GitHub Pages & Vercel)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
        });
      }
      
      // PWA Install Prompt
      let deferredPrompt;
      const installEl = document.getElementById("pwa-install");
      const installBtn = document.getElementById("pwa-install-btn");
      const closeBtn = document.getElementById("pwa-install-close");
      
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Show banner after 5 seconds
        setTimeout(() => { installEl.style.display = "flex"; }, 5000);
      });
      
      installBtn?.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        installEl.style.display = "none";
      });
      
      closeBtn?.addEventListener("click", () => {
        installEl.style.display = "none";
      });
      
      window.addEventListener("appinstalled", () => {
        installEl.style.display = "none";
        deferredPrompt = null;
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
